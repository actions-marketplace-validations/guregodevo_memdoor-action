# local-model as a user's job runs it: janis from its release, the model
# pulled and cached, Memdoor connected to it, pr-review on a change that
# plants an off-by-one. On a push, Qwen3-0.6B checks the plumbing (the run
# ends 0 or 2: a review was written); by hand, any model, timed.
name: Local model

permissions:
  contents: read

on:
  push:
  workflow_dispatch:
    inputs:
      model:
        description: The mlx-community model the review runs on
        default: Qwen3-8B-4bit

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEMDOOR_CI: '1'
      MODEL: ${{ inputs.model || 'Qwen3-0.6B-4bit' }}
    steps:
      - uses: actions/checkout@v5

      - name: A project whose last commit plants an off-by-one
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          P="$RUNNER_TEMP/calc"; mkdir -p "$P" && cd "$P" && git init -q -b main
          g() { git -c user.name=ci -c user.email=ci@example.test "$@"; }
          printf 'module calc\n\ngo 1.22\n' > go.mod
          printf 'package calc\n\n// Sum adds every value in xs.\nfunc Sum(xs []int) int {\n\tt := 0\n\tfor i := 0; i < len(xs); i++ {\n\t\tt += xs[i]\n\t}\n\treturn t\n}\n' > calc.go
          g add -A && g commit -qm "calc: Sum"
          printf 'package calc\n\n// Sum adds every value in xs.\nfunc Sum(xs []int) int {\n\tt := 0\n\tfor i := 0; i < len(xs)-1; i++ {\n\t\tt += xs[i]\n\t}\n\treturn t\n}\n\n// Mean is the average of xs.\nfunc Mean(xs []int) int {\n\treturn Sum(xs) / len(xs)\n}\n' > calc.go
          g commit -qam "calc: add Mean, tidy Sum loop"

      - name: pr-review on a model inside the job (no key)
        id: review
        continue-on-error: true
        uses: ./
        with:
          workflow: pr-review
          local-model: ${{ env.MODEL }}
          working-directory: ${{ runner.temp }}/calc
          timeout: 40m

      - name: The review was written
        if: always()
        run: |
          code='${{ steps.review.outputs.exit-code }}'
          {
            echo "### pr-review on \`$MODEL\` inside the job, no key"
            echo "- total: $(( $(date +%s) - T0 )) s (janis, the model, the review)"
            echo "- exit-code: $code (2 = a P0, the planted bug)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- janis log tail"; grep -v '^repack' "$RUNNER_TEMP/janis.log" | tail -15 || true
          case "$code" in 0|2) ;; *) echo "::error::the run ended $code, not a written review"; exit 1 ;; esac
