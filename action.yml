# Memdoor workflow as a GitHub Action: run .memdoor/workflows/<name>/ from
# the checked-out repo on the runner, on your own model key, and fail the job
# on the run's outcome. The runner installs memdoor, the first command starts
# a gateway on localhost and sets the machine up, the run is followed to its
# end (memdoor workflow run --wait). Linux and macOS runners.
#
#   - uses: actions/checkout@v5
#   - uses: guregodevo/memdoor-action@v1
#     with:
#       workflow: pr-review
#       openrouter-api-key: ${{ secrets.OPEN_ROUTER_API_KEY }}
#
# Built in, with no file in your repo: pr-review and security-review (fail on
# a blocker only), write-tests, pr-description, explain-failure (on a failed
# workflow_run), issue-triage, fix-tests (leaves the fix in the working tree),
# release-notes. A workflow of your own is .memdoor/workflows/<name>/ in the repo.
#
# Your key: the agent runs the repo's code on the runner, where the key is.
# Trigger on pull_request, NEVER pull_request_target: GitHub gives a fork's
# pull request no secrets, so a stranger's code never runs beside your key,
# while pull_request_target runs their code with your secrets. Memdoor keeps
# model keys out of the environment of every command the agent or a workflow step runs
# (shell.Env in guregodevo/memdoor), a second line, not the boundary.
#
# Exit: 0 done, 2 a task failed, 1 stopped (timeout), 3 a gate nobody in
# the job can approve (stop-at-gate, the default; its review is in the log).
name: Memdoor
description: Review PRs, write tests, explain CI failures, triage issues and more with an AI agent, on your key or a local model
author: guregodevo
branding:
  icon: git-merge
  color: blue

inputs:
  workflow:
    description: 'A built-in workflow (pr-review, fix-tests, release-notes) or your own: .memdoor/workflows/<name>/ in working-directory'
    required: true
  working-directory:
    description: The project the workflow runs in
    default: .
  timeout:
    description: A clock on the whole run, e.g. 45m (memdoor's default 2h, at most 24h)
    default: ''
  partition:
    description: Resume an earlier run by its partition, or "today" for one run a day; fresh by default
    default: ''
  stop-at-gate:
    description: 'true: a gate (an external task) ends the job with exit 3. false: wait at it, for a gateway someone approves from (memdoor workflow approve), bounded by timeout'
    default: 'true'
  install:
    description: 'true: install the latest memdoor from memdoor.ai. false: use the memdoor already on PATH'
    default: 'true'
  openrouter-api-key:
    description: OPEN_ROUTER_API_KEY — one key, every model on OpenRouter
    default: ''
  anthropic-api-key:
    description: ANTHROPIC_API_KEY
    default: ''
  openai-api-key:
    description: OPENAI_API_KEY
    default: ''
  gemini-api-key:
    description: GEMINI_API_KEY
    default: ''
  model:
    description: MEMDOOR_MODEL — pin the model the agents answer with
    default: ''
  github-token:
    description: 'GH_TOKEN for the run: the workflows that read GitHub (explain-failure reads a failed run''s logs, issue-triage the issue and the labels) use gh with it. The job''s own token by default; what it may do is what the job''s permissions grant'
    default: ${{ github.token }}
  local-model:
    description: 'No key: a model inside the job, by its mlx-community name (Qwen3-8B-4bit). The action runs it with janis (github.com/guregodevo/janis, one file) on the runner, caches it and connects it; Linux runners. A free first pass that catches obvious mistakes, not a reviewer: on a CPU, pr-review reviews in one model call and runs nothing to check a finding'
    default: ''

outputs:
  run-id:
    description: The run's id (memdoor workflow status <run-id>)
    value: ${{ steps.run.outputs.run-id }}
  exit-code:
    description: 0 done, 1 stopped, 2 failed, 3 stopped at a gate
    value: ${{ steps.run.outputs.exit-code }}
  results:
    description: What the run produced, one path per line
    value: ${{ steps.run.outputs.results }}

runs:
  using: composite
  steps:
    - name: Install memdoor
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "::error::the Memdoor workflow action runs on Linux and macOS runners"; exit 1
        fi
        curl -fsSL https://memdoor.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # A model inside the job (local-model): janis, one file, on the runner's
    # CPU; the model cached between runs, served on localhost only; nothing
    # leaves the job.
    - name: Model cache
      if: inputs.local-model != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: memdoor-janis-${{ runner.os }}-${{ inputs.local-model }}

    - name: Local model
      if: inputs.local-model != ''
      shell: bash
      env:
        LOCAL_MODEL: ${{ inputs.local-model }}
        JANIS_VERSION: v0.1.2
      run: |
        [ "$RUNNER_OS" = Linux ] || { echo "::error::local-model runs on Linux runners"; exit 1; }
        m=${LOCAL_MODEL#mlx-community/}
        curl -fsSL "https://github.com/guregodevo/janis/releases/download/$JANIS_VERSION/install.sh" | sh
        # Pulls the model when the cache has none, and returns once it has
        # answered: its first answer (laying the weights out for the CPU) is
        # paid here, not in the review.
        ~/.local/bin/janis serve --detach --model "$m" --log "$RUNNER_TEMP/janis.log"
        echo "MEMDOOR_LOCAL_MODEL_ID=$m" >> "$GITHUB_ENV"

    - name: Run the workflow
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WF_NAME: ${{ inputs.workflow }}
        WF_TIMEOUT: ${{ inputs.timeout }}
        WF_PARTITION: ${{ inputs.partition }}
        WF_STOP_AT_GATE: ${{ inputs.stop-at-gate }}
        KEY_OPENROUTER: ${{ inputs.openrouter-api-key }}
        KEY_ANTHROPIC: ${{ inputs.anthropic-api-key }}
        KEY_OPENAI: ${{ inputs.openai-api-key }}
        KEY_GEMINI: ${{ inputs.gemini-api-key }}
        WF_MODEL: ${{ inputs.model }}
        LOCAL_MODEL: ${{ inputs.local-model }}
        GH_TOKEN: ${{ inputs.github-token }}
        # The runner's gateway is for this job only: no door on the network.
        MEMDOOR_HOST: localhost
        MEMDOOR_NO_BROWSER: '1'
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        if [ -n "$LOCAL_MODEL" ]; then
          # Local OR a key, never both: a local run sees no provider key at all.
          if [ -n "$KEY_OPENROUTER$KEY_ANTHROPIC$KEY_OPENAI$KEY_GEMINI" ]; then
            echo "::warning::local-model is set: the key inputs are ignored, the review runs on $LOCAL_MODEL inside the job"
          fi
          # A model on the runner's CPU: a built-in with a one-call version
          # (pr-review's review-lean) takes it instead of the agent loop.
          export MEMDOOR_LEAN=1
          unset OPEN_ROUTER_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY \
                GROQ_API_KEY DEEPSEEK_API_KEY XAI_API_KEY GROK_API_KEY BASETEN_API_KEY TYPESAFE_API_KEY \
                MEMDOOR_SYSTEMONE_API_KEY AI_GATEWAY_TOKEN
        else
          # A key given as an input wins; one set in the job's env is kept.
          [ -n "$KEY_OPENROUTER" ] && export OPEN_ROUTER_API_KEY="$KEY_OPENROUTER"
          [ -n "$KEY_ANTHROPIC" ] && export ANTHROPIC_API_KEY="$KEY_ANTHROPIC"
          [ -n "$KEY_OPENAI" ] && export OPENAI_API_KEY="$KEY_OPENAI"
          [ -n "$KEY_GEMINI" ] && export GEMINI_API_KEY="$KEY_GEMINI"
          [ -n "$WF_MODEL" ] && export MEMDOOR_MODEL="$WF_MODEL"
        fi
        unset KEY_OPENROUTER KEY_ANTHROPIC KEY_OPENAI KEY_GEMINI

        memdoor --version
        if [ -n "$LOCAL_MODEL" ]; then
          memdoor connect local --base http://127.0.0.1:8090/v1 --model "$MEMDOOR_LOCAL_MODEL_ID"
        fi
        args=(workflow run "$WF_NAME" --dir .)
        [ -n "$WF_TIMEOUT" ] && args+=(--timeout "$WF_TIMEOUT")
        [ -n "$WF_PARTITION" ] && args+=(--partition "$WF_PARTITION")
        if [ "$WF_STOP_AT_GATE" = "true" ]; then args+=(--stop-at-gate); else args+=(--wait); fi

        # memdoor writes the job summary and the step outputs itself.
        set +e
        memdoor "${args[@]}"
        code=$?
        set -e
        # A failed task says why above; a stop or a crash may be the gateway's.
        if [ "$code" != 0 ] && [ "$code" != 2 ] && [ "$code" != 3 ]; then
          echo "::group::gateway errors"; memdoor logs errors --since 6h 2>&1 | tail -40 || true; echo "::endgroup::"
        fi
        exit $code
